name: Build fanqie-dl for Termux

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android NDK & Cross Compile Toolchain
        run: |
          apt-get update && apt-get install -y gcc-aarch64-linux-android
          echo 'CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android-gcc' >> $GITHUB_ENV

      - name: Build for Termux (aarch64)
        run: cargo build --release --target aarch64-linux-android

      - name: Upload Termux Binary as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fanqie-dl-termux
          path: target/aarch64-linux-android/release/fanqie-dl

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: termux-build-${{ github.sha }}
          name: Termux Build ${{ github.sha }}
          files: target/aarch64-linux-android/release/fanqie-dl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
