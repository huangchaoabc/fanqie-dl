name: Build FanqieDL (Linux PC Only)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install all required system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev pkg-config cmake build-essential \
            libboost-all-dev libfmt-dev libllvm-dev

      - name: Build with full debug info (see all errors)
        run: cargo build --release -- --error-limit=0

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: fanqie-dl-linux
          path: target/release/fanqie-dl
