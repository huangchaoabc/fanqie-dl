name: Build fanqie-dl for Termux

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android NDK & Build Dependencies
        run: |
          apt-get update && apt-get install -y \
            gcc-aarch64-linux-android \
            libssl-dev \
            pkg-config

      - name: Set Env for Cross Compile & Vendored OpenSSL
        run: |
          echo 'CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android-gcc' >> $GITHUB_ENV
          echo 'OPENSSL_STATIC=1' >> $GITHUB_ENV
          echo 'OPENSSL_VENDORED=1' >> $GITHUB_ENV

      - name: Build for Termux (aarch64)
        run: cargo build --release --target aarch64-linux-android

      - name: Upload Termux Binary
        uses: actions/upload-artifact@v4
        with:
          name: fanqie-dl-termux
          path: target/aarch64-linux-android/release/fanqie-dl
